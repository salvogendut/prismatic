[package]
name = "prismatic"
version = "0.1.4"
edition = "2024"
publish = false
description = "A Happy Years desktop frontend for the Iris SGI emulator"
license = "BSD-3-Clause"

[features]
pcap = ["iris/pcap"]
wgpu = ["iris/wgpu"]
gpujit = ["iris/gpujit"]
hostgl = ["iris/hostgl"]
idle-pause = ["iris/idle-pause"]
jitv2 = ["iris/jitv2"]
perfetto = ["iris/perfetto"]
developer = ["iris/developer"]

[dependencies]
iris = { path = "../iris" }
# CHD inspection and blank-disk creation use Iris's storage library.
libchdman-rs = { version = "0.289.2", features = ["prebuilt"] }
# Iris's PS/2 API currently takes this physical-key enum. SDL owns all events.
winit = { version = "0.30", default-features = false }
sdl3 = "0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
blake3 = "1"
gif = "0.14.2"
png = "0.18"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "term", "signal"] }

# Cargo only applies patches declared by the root package. Preserve the fork's
# patched host dependencies when embedding Iris from this separate repository.
[patch.crates-io]
winit = { path = "../iris/third_party/winit-0.30.13" }
block = { path = "../iris/third_party/block-0.1.6" }

[profile.dev.package.iris]
opt-level = 2

[profile.test.package.iris]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
