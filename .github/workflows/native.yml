name: Native packages

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'

jobs:
  plan:
    name: Pin release sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test packaging helpers and resolve Iris once
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 tools/native.py plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-source-plan
          path: target/native-plan.json
          if-no-files-found: error

  linux:
    name: ${{ matrix.platform }} x86_64
    needs: plan
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: fedora, container: 'fedora:44'}
          - {platform: debian, container: 'debian:trixie'}
    timeout-minutes: 90
    env:
      # Actions' container HOME can differ from the account's home. Keep Rust
      # in task-specific paths, without changing the runner's HOME.
      RUSTUP_HOME: /opt/prismatic-rustup
      CARGO_HOME: /opt/prismatic-cargo
      RUSTUP_INIT_SKIP_PATH_CHECK: 'yes'
    steps:
      - name: Fedora dependencies
        if: matrix.platform == 'fedora'
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git python3 curl ca-certificates gcc gcc-c++ make pkgconf-pkg-config \
            SDL3-devel alsa-lib-devel clang-devel libpcap-devel \
            libX11-devel libXcursor-devel libXi-devel libXrandr-devel \
            libxkbcommon-devel wayland-devel mesa-libGL-devel \
            rpm-build hicolor-icon-theme desktop-file-utils
      - name: Debian dependencies
        if: matrix.platform == 'debian'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 curl ca-certificates build-essential pkg-config \
            libsdl3-dev libasound2-dev clang libclang-dev libpcap-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libwayland-dev libgl-dev dpkg-dev hicolor-icon-theme desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust checkout and install the pinned Rust toolchain
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/prismatic-rustup.sh
          sh /tmp/prismatic-rustup.sh -y --no-modify-path --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-source-plan
          path: target
      - name: Build, package, install and smoke-test
        run: python3 tools/native.py build --platform ${{ matrix.platform }} --install-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}-x86_64
          path: target/native/dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64 (MSVC)
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure MSVC and long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          ./packaging/native/msvc.ps1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-source-plan
          path: target
      - name: Build and smoke-test portable ZIP
        run: python tools/native.py build --platform windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-x86_64
          path: target/native/dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          brew install sdl3 libpcap pkg-config dylibbundler
          echo "PKG_CONFIG_PATH=$(brew --prefix libpcap)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-source-plan
          path: target
      - name: Build, bundle, sign ad hoc and smoke-test
        run: python3 tools/native.py build --platform macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-${{ matrix.arch }}
          path: target/native/dist/*
          if-no-files-found: error

  release-assets:
    name: Attach native release packages
    if: github.event_name == 'release'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Upload packages, checksums and build information
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          rm dist/native-plan.json
          gh release upload "$RELEASE_TAG" --clobber dist/*
