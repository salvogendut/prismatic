name: Linux Flatpak

on:
  push:
    tags: ['**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder \
            appstream appstream-compose appstream-util desktop-file-utils
          # Ubuntu's runner policy can prevent bubblewrap's build namespaces.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.llvm22//26.08

      - name: Test packaging helpers
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Fetch Iris xiri and Instigator main; build the bundle
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            export FLATPAK_VERSION="$RELEASE_TAG"
          fi
          make flatpak

      - name: Validate desktop metadata
        run: |
          desktop-file-validate target/flatpak/build/files/share/applications/io.github.salvogendut.Prismatic.desktop
          appstreamcli validate --no-net target/flatpak/build/files/share/metainfo/io.github.salvogendut.Prismatic.metainfo.xml

      - name: Install and smoke-test the sandboxed app
        run: |
          flatpak install --user --assumeyes --noninteractive target/flatpak/Prismatic-x86_64.flatpak
          timeout 30s flatpak run --command=/app/libexec/instigator io.github.salvogendut.Prismatic --version
          timeout 30s flatpak run --env=SDL_VIDEODRIVER=dummy --env=SDL_RENDER_DRIVER=software \
            --env=SDL_AUDIODRIVER=dummy io.github.salvogendut.Prismatic \
            --config /tmp/prismatic-flatpak-ci.cfg --smoke-test
          timeout 180s flatpak run --env=SDL_VIDEODRIVER=dummy --env=SDL_RENDER_DRIVER=software \
            --env=SDL_AUDIODRIVER=dummy --env=IRIS_REX_JIT_PROFILE=/tmp/prismatic-flatpak-ci-rex.bin \
            io.github.salvogendut.Prismatic --config /tmp/prismatic-flatpak-ci.cfg --boot-smoke-test

      - name: Upload installable Flatpak and source revisions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prismatic-Linux-x86_64
          compression-level: 0
          if-no-files-found: error
          path: |
            target/flatpak/Prismatic-x86_64.flatpak
            target/flatpak/SHA256SUMS
            target/flatpak/build-info.json
            target/flatpak/io.github.salvogendut.Prismatic.json
            target/flatpak/cargo-sources.json

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Prismatic-Linux-x86_64
          path: dist
      - name: Attach bundle to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            dist/Prismatic-x86_64.flatpak dist/SHA256SUMS dist/build-info.json
